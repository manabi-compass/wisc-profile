<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>WISC-V Profile</title>
<style>*{box-sizing:border-box}body{margin:0;background:#f6f4ef;color:#252525;font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue","Yu Gothic",sans-serif}.c{width:min(92%,720px);margin:auto;padding:36px 0 70px}.top{font-size:11px;letter-spacing:2px;color:#777;margin-bottom:36px}h1{font-size:48px;line-height:1;margin:0 0 14px}.sub,.desc{color:#777;line-height:1.7}.sub{margin-bottom:35px}.card{background:#fff;border:1px solid #e4e0d9;border-radius:18px;padding:22px;margin-bottom:18px}.ttl{font-size:12px;font-weight:700;letter-spacing:1.5px;color:#777;margin-bottom:18px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.box{background:#faf9f6;border:1px solid #e5e1da;border-radius:13px;padding:14px}label{display:block;font-size:12px;color:#777;margin-bottom:7px}input,select{width:100%;padding:13px;border:1px solid #ddd8d1;border-radius:9px;background:#fff;font-size:16px}.age{margin-bottom:16px}button{width:100%;margin-top:16px;padding:16px;border:0;border-radius:11px;background:#222;color:#fff;font-size:16px;font-weight:700}#result{display:none}.hero{text-align:center;padding:10px}.num{font-size:68px;font-weight:700}.row{margin:22px 0}.head{display:flex;justify-content:space-between;font-weight:700}.score{font-size:22px}.track{height:8px;background:#ece9e3;border-radius:10px;overflow:hidden;margin-top:8px}.fill{height:100%;background:#222}.desc{font-size:12px;margin-top:7px}.analysis{border-top:1px solid #eee8df;padding-top:20px;margin-top:25px}.analysis p{line-height:1.9;color:#555}.tag{display:inline-block;background:#efede8;border-radius:30px;padding:7px 11px;margin:3px;font-size:12px}.note{font-size:11px;color:#999;line-height:1.7}@media(max-width:520px){.grid{grid-template-columns:1fr}h1{font-size:40px}}</style></head>
<body><main class="c"><div class="top">WISC-V PROFILE / v0.1</div><h1>WISC-V<br>Profile</h1><div class="sub">WISC-Vの指数を入力すると、プロフィールを見やすく整理して表示します。</div>
<section class="card"><div class="ttl">BASIC INFORMATION</div><div class="age"><label>年齢</label><select><option>6</option><option>7</option><option>8</option><option>9</option><option>10</option><option selected>11</option><option>12</option><option>13</option><option>14</option><option>15</option><option>16</option></select></div><div class="grid">
<div class="box"><label>言語理解（VCI）</label><input id="vci" type="number" placeholder="例：120"></div><div class="box"><label>視空間（VSI）</label><input id="vsi" type="number" placeholder="例：138"></div><div class="box"><label>流動性推理（FRI）</label><input id="fri" type="number" placeholder="例：142"></div><div class="box"><label>ワーキングメモリ（WMI）</label><input id="wmi" type="number" placeholder="例：95"></div><div class="box"><label>処理速度（PSI）</label><input id="psi" type="number" placeholder="例：88"></div><div class="box"><label>全検査IQ（FSIQ）</label><input id="fsiq" type="number" placeholder="任意"></div></div><button onclick="go()">プロフィールを見る</button></section>
<section class="card" id="result"><div class="ttl">PROFILE</div><div class="hero"><div class="desc">最大指数差</div><div class="num" id="range"></div></div><div id="bars"></div><div class="analysis"><h2>このプロフィールの特徴</h2><p id="text"></p><div id="tags"></div></div></section>
<div class="note">※このページはWISC-Vの結果を整理して理解するための補助ツールです。診断や医学的・心理学的判断を行うものではありません。正式な解釈は検査を実施した専門家にご確認ください。</div></main>
<script>
const I={vci:["言語理解","言葉の理解や、言語を使って考える力"],vsi:["視空間","形や位置関係を視覚的に捉える力"],fri:["流動性推理","規則性を見つけ論理的に考える力"],wmi:["ワーキングメモリ","情報を一時的に保持しながら扱う力"],psi:["処理速度","視覚情報を正確かつ素早く処理する力"]};
function lev(s){return s>=130?"非常に高い":s>=120?"高い":s>=110?"平均の上":s>=90?"平均":s>=80?"平均の下":s>=70?"低い":"非常に低い"}
function go(){let ks=["vci","vsi","fri","wmi","psi"],v={};for(let k of ks){v[k]=+document.getElementById(k).value;if(!v[k]||v[k]<40||v[k]>160){alert("5つの指数を40〜160で入力してください");return}}let a=Object.values(v),r=Math.max(...a)-Math.min(...a);range.textContent=r;bars.innerHTML=ks.map(k=>`<div class="row"><div class="head"><span>${I[k][0]}</span><span class="score">${v[k]}</span></div><div class="desc">${I[k][1]}</div><div class="track"><div class="fill" style="width:${Math.max(0,Math.min(100,(v[k]-40)/1.2))}%"></div></div><div class="desc">${lev(v[k])}</div></div>`).join("");let s=Object.entries(v).sort((a,b)=>b[1]-a[1]),hi=s[0],lo=s[4];let t=`最も高い指数は「${I[hi[0]][0]}」の${hi[1]}、最も低い指数は「${I[lo[0]][0]}」の${lo[1]}です。指数間には最大${r}ポイントの差があります。`;if(r>=30)t+=" 得意な課題と負荷のかかりやすい課題の差が大きいプロフィールです。";else if(r>=20)t+=" 得意・不得意が比較的はっきりしたプロフィールです。";if(v.vsi>=130&&v.fri>=130)t+=" 視覚的に捉える力と、新しい問題を推理する力が特に高い傾向があります。";if(v.fri-v.psi>=25||v.vsi-v.psi>=25)t+=" 思考力に対して処理速度が相対的に低い場合、理解できても時間内に終わりにくいことがあります。";text.textContent=t;let tags=[];if(v.vsi>=130)tags.push("視覚的思考が強い");if(v.fri>=130)tags.push("推理力が強い");if(v.vci>=120)tags.push("言語理解が高い");if(r>=25)tags.push("指数差が大きい");if(v.psi<=90)tags.push("速度より思考重視");document.getElementById("tags").innerHTML=tags.map(x=>`<span class="tag">${x}</span>`).join("");result.style.display="block";result.scrollIntoView({behavior:"smooth"})}
</script></body></html>
